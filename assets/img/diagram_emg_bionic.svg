<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141d2f" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Header / Badge -->
  <rect x="40" y="36" width="340" height="32" rx="4" fill="#1e293b" stroke="#334155" />
  <text x="52" y="57" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">SYSTEM SCHEMATIC // EMG-01</text>
  <text x="390" y="57" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">BIONIC ARM SERVO ACTUATION</text>

  <!-- Block 1: EMG Sensors -->
  <g transform="translate(50, 120)">
    <rect width="180" height="150" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="12" y="12" width="156" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700">MYOWARE EMG SENSOR</text>
    <text x="20" y="60" fill="#94a3b8" font-family="monospace" font-size="11">Surface Electrodes</text>
    <path d="M 20 90 Q 35 70, 50 90 T 80 90 T 110 90 T 140 90" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
    <text x="20" y="125" fill="#64748b" font-family="monospace" font-size="10">Raw Bio-Potential</text>
    <text x="20" y="140" fill="#38bdf8" font-family="monospace" font-size="10">0.5mV - 5.0mV</text>
  </g>

  <!-- Flow 1 to 2 -->
  <line x1="230" y1="195" x2="295" y2="195" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,2" />

  <!-- Block 2: Signal Conditioning -->
  <g transform="translate(305, 120)">
    <rect width="190" height="150" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="12" y="12" width="166" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">ADC &amp; FILTER STAGE</text>
    <text x="20" y="60" fill="#94a3b8" font-family="monospace" font-size="11">Active Bandpass</text>
    <text x="20" y="78" fill="#64748b" font-family="monospace" font-size="10">20Hz - 500Hz Cutoff</text>
    <text x="20" y="105" fill="#94a3b8" font-family="monospace" font-size="11">Rectification</text>
    <text x="20" y="125" fill="#64748b" font-family="monospace" font-size="10">Full-Wave Envelope</text>
    <text x="20" y="140" fill="#10b981" font-family="monospace" font-size="10">SNR &gt; 38 dB</text>
  </g>

  <!-- Flow 2 to 3 -->
  <line x1="495" y1="195" x2="560" y2="195" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" stroke-dasharray="4,2" />

  <!-- Block 3: MCU / Pico -->
  <g transform="translate(570, 120)">
    <rect width="180" height="150" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="12" y="12" width="156" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="700">RP2040 CONTROLLER</text>
    <text x="20" y="60" fill="#94a3b8" font-family="monospace" font-size="11">Dual ARM Cortex-M0+</text>
    <text x="20" y="80" fill="#64748b" font-family="monospace" font-size="10">Threshold Map logic</text>
    <text x="20" y="105" fill="#94a3b8" font-family="monospace" font-size="11">Latency: &lt;200ms</text>
    <text x="20" y="130" fill="#a78bfa" font-family="monospace" font-size="10">PWM Gen (50Hz)</text>
  </g>

  <!-- Downward flow to Actuation -->
  <path d="M 660 270 L 660 340 L 410 340 L 410 380" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,2" />

  <!-- Block 4: Multi-DOF Actuation -->
  <g transform="translate(180, 390)">
    <rect width="440" height="160" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <rect x="16" y="14" width="408" height="28" rx="4" fill="#1e293b" />
    <text x="28" y="33" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">MULTI-AXIS SERVO ACTUATION &amp; GRIPPER</text>
    
    <!-- Sub modules -->
    <g transform="translate(24, 56)">
      <rect width="115" height="85" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Wrist Rotator</text>
      <text x="12" y="45" fill="#94a3b8" font-family="monospace" font-size="10">MG996R Servo</text>
      <text x="12" y="65" fill="#34d399" font-family="monospace" font-size="10">180° Range</text>
    </g>

    <g transform="translate(162, 56)">
      <rect width="115" height="85" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Flexor Tendons</text>
      <text x="12" y="45" fill="#94a3b8" font-family="monospace" font-size="10">High-Torque Dig.</text>
      <text x="12" y="65" fill="#34d399" font-family="monospace" font-size="10">5 Finger Indep.</text>
    </g>

    <g transform="translate(300, 56)">
      <rect width="115" height="85" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Feedback Loop</text>
      <text x="12" y="45" fill="#94a3b8" font-family="monospace" font-size="10">Current Sensing</text>
      <text x="12" y="65" fill="#34d399" font-family="monospace" font-size="10">Grip Auto-Stop</text>
    </g>
  </g>
</svg>
