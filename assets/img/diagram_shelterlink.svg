<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradIoT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f1b" />
      <stop offset="100%" stop-color="#121e33" />
    </linearGradient>
    <pattern id="gridIoT" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <marker id="arrow-green2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradIoT)" />
  <rect width="800" height="600" fill="url(#gridIoT)" />

  <!-- Header / Badge -->
  <rect x="40" y="36" width="370" height="32" rx="4" fill="#1e293b" stroke="#334155" />
  <text x="52" y="57" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">PATENT NO. 202411050202 // IOT-01</text>
  <text x="420" y="57" fill="#34d399" font-family="monospace" font-size="12" font-weight="600">SHELTERLINK IOT DISASTER NETWORK</text>

  <!-- Block 1: Sensor Nodes -->
  <g transform="translate(45, 110)">
    <rect width="210" height="190" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <rect x="12" y="12" width="186" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">DISTRIBUTED SENSOR NODES</text>
    
    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">DHT22 Temp &amp; Humidity</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">Structural Load Cells</text>
    
    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">PIR Occupancy Sensors</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">CO2 &amp; Air Quality (MQ-135)</text>
    
    <text x="20" y="165" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">Low-Power Sleep (15uA)</text>
  </g>

  <!-- Flow 1 to Gateway -->
  <line x1="255" y1="205" x2="310" y2="205" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green2)" />

  <!-- Block 2: Embedded Gateway -->
  <g transform="translate(320, 110)">
    <rect width="200" height="190" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="12" y="12" width="176" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">MESH GATEWAY</text>
    
    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">ESP32 / LoRa 868MHz</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">Local Anomaly Detection</text>
    
    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">Offline Data Logging</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">Flash Storage Ring Buffer</text>

    <text x="20" y="165" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">Solar + Battery Backup</text>
  </g>

  <!-- Flow 2 to Cloud & Emergency Alert -->
  <line x1="520" y1="205" x2="575" y2="205" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue3)" />

  <!-- Block 3: Dashboard & Alerts -->
  <g transform="translate(585, 110)">
    <rect width="170" height="190" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="12" y="12" width="146" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">EMERGENCY CLOUD</text>

    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">MQTT Broker (TLS)</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">Automated SMS/Voice</text>

    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">GIS Map Dashboard</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">Real-time Capacity</text>

    <text x="20" y="165" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="700">Resilience: 99.9% Uptime</text>
  </g>

  <!-- Bottom Panel: System Specs -->
  <g transform="translate(45, 335)">
    <rect width="710" height="215" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="14" width="678" height="28" rx="4" fill="#1e293b" />
    <text x="28" y="33" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">DISASTER MANAGEMENT SYSTEM PROTOCOLS &amp; SPECS</text>

    <g transform="translate(24, 60)">
      <text x="0" y="16" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">WIRELESS PROTOCOL</text>
      <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Long Range LoRa (Point-to-Multipoint)</text>
      <text x="0" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">Wi-Fi &amp; GSM Cellular Fallback</text>
      <text x="0" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Mesh Self-Healing Routing Node Topology</text>
      <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11">AES-GCM Payload Encryption</text>
    </g>

    <g transform="translate(360, 60)">
      <text x="0" y="16" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">EMBEDDED FIRMWARE</text>
      <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">FreeRTOS Multitasking Architecture</text>
      <text x="0" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">Watchdog Timer Auto-Recovery</text>
      <text x="0" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Deep-Sleep Duty Cycling for 72h Battery Life</text>
      <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11">Over-the-Air (OTA) Firmware Upgrade Support</text>
    </g>
  </g>
</svg>
