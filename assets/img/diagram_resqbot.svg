<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradResq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#141c2c" />
    </linearGradient>
    <pattern id="gridResq" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradResq)" />
  <rect width="800" height="600" fill="url(#gridResq)" />

  <!-- Header / Badge -->
  <rect x="40" y="36" width="370" height="32" rx="4" fill="#1e293b" stroke="#334155" />
  <text x="52" y="57" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">ROBOTICS ARCHITECTURE // RESQ-BOT</text>
  <text x="420" y="57" fill="#f87171" font-family="monospace" font-size="12" font-weight="600">DISASTER SEARCH &amp; RESCUE PAYLOAD</text>

  <!-- Section 1: Perception & Sensors -->
  <g transform="translate(45, 110)">
    <rect width="210" height="190" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5" />
    <rect x="12" y="12" width="186" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="700">HAZARD &amp; VISION SENSORS</text>
    
    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Thermal IR Camera</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">Human Heat Signature</text>
    
    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">MQ-4 / MQ-7 Gas Arrays</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">CO &amp; Methane Detection</text>
    
    <text x="20" y="165" fill="#f87171" font-family="monospace" font-size="10" font-weight="700">Ultrasonic Array (360°)</text>
  </g>

  <!-- Flow 1 to Central Hub -->
  <line x1="255" y1="205" x2="310" y2="205" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Section 2: Onboard Processing -->
  <g transform="translate(320, 110)">
    <rect width="200" height="190" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="12" y="12" width="176" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">CENTRAL CONTROLLER</text>
    
    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Embedded Microcontroller</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">Real-time Telemetry Loop</text>
    
    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">Obstacle Avoidance Logic</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">Autonomous Path Override</text>

    <text x="20" y="165" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">Fail-Safe Emergency Stop</text>
  </g>

  <!-- Flow 2 to Drive & Radio -->
  <line x1="520" y1="205" x2="575" y2="205" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue2)" />

  <!-- Section 3: Telemetry & RF -->
  <g transform="translate(585, 110)">
    <rect width="170" height="190" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <rect x="12" y="12" width="146" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">LONG-RANGE RF</text>

    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">2.4GHz ISM Band</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">AES-128 Encrypted Link</text>

    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">Low-Latency Video</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">Analog/Digital Feed</text>

    <text x="20" y="165" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">Range: Up to 1.2km</text>
  </g>

  <!-- Section 4: Mechanical & Mobility -->
  <g transform="translate(45, 335)">
    <rect width="710" height="215" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="14" width="678" height="28" rx="4" fill="#1e293b" />
    <text x="28" y="33" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">CHASSIS, ACTUATION &amp; POWER DISTRIBUTION</text>

    <g transform="translate(24, 60)">
      <text x="0" y="16" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">HIGH-TORQUE DRIVE</text>
      <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Tracked Tread / 4WD Planetary Gears</text>
      <text x="0" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">Dual H-Bridge Motor Drivers (BTS7960)</text>
      <text x="0" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">35° Max Incline Climbing Capability</text>
      <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11">Ruggedized Aluminum Extrusion Frame</text>
    </g>

    <g transform="translate(360, 60)">
      <text x="0" y="16" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">POWER &amp; PAYLOAD</text>
      <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">3S LiPo 5200mAh Power Cell</text>
      <text x="0" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">Buck Converters (5V/3A &amp; 3.3V Regulated)</text>
      <text x="0" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Emergency First-Aid Payload Bay (1.5kg)</text>
      <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11">IP54 Water &amp; Dust Resistant Shell</text>
    </g>
  </g>
</svg>
