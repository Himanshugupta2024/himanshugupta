<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#10192e" />
    </linearGradient>
    <pattern id="gridAV" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-cyan2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradAV)" />
  <rect width="800" height="600" fill="url(#gridAV)" />

  <!-- Header / Badge -->
  <rect x="40" y="36" width="370" height="32" rx="4" fill="#1e293b" stroke="#334155" />
  <text x="52" y="57" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">VISION PIPELINE // OPTI-VISION</text>
  <text x="420" y="57" fill="#c084fc" font-family="monospace" font-size="12" font-weight="600">AUTONOMOUS VEHICLE PERCEPTION</text>

  <!-- Block 1: Camera & Acquisition -->
  <g transform="translate(45, 110)">
    <rect width="210" height="190" rx="8" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
    <rect x="12" y="12" width="186" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">VIDEO INGESTION</text>
    
    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Wide-Angle Camera</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">1080p @ 30 FPS</text>
    
    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">Color Space Conversion</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">BGR to HSV / Grayscale</text>
    
    <text x="20" y="165" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700">ROI Perspective Warp</text>
  </g>

  <!-- Flow 1 to Computer Vision Processing -->
  <line x1="255" y1="205" x2="310" y2="205" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- Block 2: Computer Vision -->
  <g transform="translate(320, 110)">
    <rect width="200" height="190" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="12" y="12" width="176" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">OPENCV PERCEPTION</text>
    
    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Canny Edge &amp; Hough</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">Lane Curvature Fit</text>
    
    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">Haar / MobileNet SSD</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">Signal &amp; Sign Detection</text>

    <text x="20" y="165" fill="#06b6d4" font-family="monospace" font-size="10" font-weight="700">Steering Angle Calc</text>
  </g>

  <!-- Flow 2 to Actuation Control -->
  <line x1="520" y1="205" x2="575" y2="205" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan2)" />

  <!-- Block 3: Decision & Actuation -->
  <g transform="translate(585, 110)">
    <rect width="170" height="190" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <rect x="12" y="12" width="146" height="24" rx="4" fill="#1e293b" />
    <text x="20" y="28" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">VEHICLE CONTROL</text>

    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">PID Controller</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="10">PWM Throttle &amp; Steer</text>

    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">Speed Control</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">Adaptive Braking</text>

    <text x="20" y="165" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">Lat: ~45ms Pipeline</text>
  </g>

  <!-- Bottom Panel: System Specs -->
  <g transform="translate(45, 335)">
    <rect width="710" height="215" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="14" width="678" height="28" rx="4" fill="#1e293b" />
    <text x="28" y="33" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">PATENT NO. 202411078533 — AUTONOMOUS VEHICLE EMBEDDED SYSTEM</text>

    <g transform="translate(24, 60)">
      <text x="0" y="16" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700">COMPUTE HARDWARE</text>
      <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Raspberry Pi 4 Model B (4GB RAM)</text>
      <text x="0" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">L298N Dual Motor Driver Shield</text>
      <text x="0" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Sony IMX219 8MP Camera Sensor</text>
      <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11">HC-SR04 Ultrasonic Collision Backup</text>
    </g>

    <g transform="translate(360, 60)">
      <text x="0" y="16" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">SOFTWARE &amp; FRAMEWORKS</text>
      <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Python 3.9 + OpenCV 4.x</text>
      <text x="0" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">NumPy Optimized Array Processing</text>
      <text x="0" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Custom Sliding Window Lane Fit Algorithm</text>
      <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11">Real-time Telemetry Dashboard via WebSockets</text>
    </g>
  </g>
</svg>
